<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-CAM Fire & Blast Detector</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #ff6b35;
            margin-bottom: 10px;
            text-align: center;
            font-size: 1.8rem;
        }
        .subtitle {
            color: #888;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .stream-box {
            position: relative;
            width: 100%;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
        }
        .stream-box.alert { border-color: #ff3333; animation: pulse-border 0.5s infinite alternate; }
        .stream-box.freeze { border-color: #3388ff; animation: pulse-border 0.5s infinite alternate; }
        @keyframes pulse-border { from { box-shadow: 0 0 5px currentColor; } to { box-shadow: 0 0 25px currentColor; } }
        
        #videoFeed {
            width: 100%;
            height: auto;
            display: block;
        }
        #canvasOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #1a1a1a;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #444;
            transition: all 0.3s;
        }
        .status-dot.active { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .status-dot.fire { background: #ff3333; box-shadow: 0 0 15px #ff3333; animation: blink 0.5s infinite; }
        .status-dot.freeze { background: #3388ff; box-shadow: 0 0 15px #3388ff; animation: blink 0.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,107,53,0.4); }
        .btn-secondary {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
        }
        .btn-secondary:hover { background: #333; }
        
        .log-box {
            background: #111;
            border-radius: 10px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #222;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .log-entry.fire { color: #ff6b35; }
        .log-entry.freeze { color: #4488ff; }
        .log-entry.info { color: #888; }
        
        .settings {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #333;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #222;
        }
        .setting-row:last-child { border-bottom: none; }
        input[type="text"], input[type="range"] {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            width: 60%;
        }
        input[type="range"] { width: 60%; }
        .threshold-value { color: #ff6b35; font-weight: bold; min-width: 40px; text-align: right; }
        
        .overlay-badge {
            position: absolute;
            top: 10px; right: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            display: none;
        }
        .overlay-badge.fire {
            display: block;
            background: rgba(255, 50, 50, 0.9);
            color: white;
        }
        .overlay-badge.freeze {
            display: block;
            background: rgba(50, 100, 255, 0.9);
            color: white;
        }
        
        .ip-input {
            width: 100%;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            .controls { grid-template-columns: 1fr; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <h1>🔥 ESP32-CAM Fire & Blast Detector</h1>
    <p class="subtitle">Computer Vision Detection via Live Stream</p>
    
    <div class="container">
        <div class="settings">
            <div class="setting-row">
                <label>ESP32-CAM IP / Stream URL:</label>
                <input type="text" id="streamUrl" placeholder="http://192.168.1.45/stream" value="">
            </div>
            <div class="setting-row">
                <label>Fire Sensitivity:</label>
                <div style="display:flex; align-items:center; gap:10px; width:60%;">
                    <input type="range" id="fireThreshold" min="10" max="90" value="35">
                    <span class="threshold-value" id="fireThresholdVal">35%</span>
                </div>
            </div>
            <div class="setting-row">
                <label>Freeze Timeout:</label>
                <div style="display:flex; align-items:center; gap:10px; width:60%;">
                    <input type="range" id="freezeTimeout" min="5" max="30" value="10">
                    <span class="threshold-value" id="freezeTimeoutVal">10s</span>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn-primary" onclick="startDetection()">▶ Start Detection</button>
            <button class="btn-secondary" onclick="stopDetection()">⏹ Stop</button>
            <button class="btn-secondary" onclick="requestNotificationPermission()">🔔 Enable Notifications</button>
            <button class="btn-secondary" onclick="clearLog()">🗑 Clear Log</button>
        </div>
        
        <div class="stream-box" id="streamBox">
            <img id="videoFeed" crossorigin="anonymous" alt="ESP32-CAM Stream">
            <canvas id="canvasOverlay"></canvas>
            <div class="overlay-badge" id="fireBadge">🔥 FIRE/BLAST DETECTED!</div>
            <div class="overlay-badge" id="freezeBadge">❄️ CAMERA FROZEN!</div>
        </div>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="streamDot"></div>
                <span id="streamStatus">Stream Offline</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="fireDot"></div>
                <span id="fireStatus">No Fire</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="freezeDot"></div>
                <span id="freezeStatus">Camera Active</span>
            </div>
        </div>
        
        <div class="log-box" id="logBox">
            <div class="log-entry info">System ready. Enter ESP32-CAM IP and click Start.</div>
        </div>
    </div>

    <script src="detector.js"></script>
</body>
</html>
